name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test and package
        run: ./gradlew --no-daemon test demo installDist distZip distTar
      - name: CLI smoke test
        run: |
          build/install/mixinscope/bin/mixinscope --help
          build/install/mixinscope/bin/mixinscope scan build/demo/mods --format json --output build/demo/cli-report.json
          node -e "const r=JSON.parse(require('fs').readFileSync('build/demo/cli-report.json'));if(!r.findings.some(f=>f.rule==='MS002'))process.exit(1)"
      - name: HTML DOM tests
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test:html
      - name: Synthetic scale check
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mixinscope-${{ runner.os }}
          path: |
            build/distributions/*
            build/reports/tests/test/**
            build/demo/report.*
            build/benchmark/results.csv
